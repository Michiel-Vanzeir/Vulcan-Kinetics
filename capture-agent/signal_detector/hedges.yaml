# Hedge words and phrases per language. Keys must be two-letter language codes,
# because the key (never the phrase) is what ends up in the payload.
#
# Matching: whole words, when the last word is completed, case-insensitive, and
# insensitive to accents and apostrophes ("peut etre", "Im not sure" also match).
# Leave out words that are mostly used neutrally; every false hit makes someone look
# less sure than they are. Deliberately excluded: "about", "should", "double check",
# NL "mogelijk" ("zo snel mogelijk"), DE "noch offen" ("offen für"), FR "pas sûr"
# (matches "pas sur" once accents are ignored), "ca." (matches FR "ça").
#
# Unresolved markers (TBD, "nog te bepalen", "à confirmer", ...) are listed here too:
# the writer is flagging something they don't know yet.

