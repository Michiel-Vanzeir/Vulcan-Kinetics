payslip: [paysilp, payslipp, playslip]
loonbrief: [loonbrif, loonbreif]
maaltijdcheque: [maaltijdcheck, maaltijdscheque, maaltijdcheq]
maaltijdcheques: [maaltijdchecks, maaltijdscheques]
cheque repas: [chequerepas, chequesrepas]
ziekteverlof: [ziekenverlof, ziekteverloff, ziekterverlof]
vakantiegeld: [vakantiegelt, vacantiegeld, vakantigeld]
bedrijfswagen: [bedrijfswagon, bedrijfwagen]
groepsverzekering: [groepverzekering, groepsverzekring]
bedrijfsvoorheffing: [bedrijfsvoorheffng, bedrijfsvoorhefing, bedrijfvoorheffing]
teletravail: [teletravial, teletavail]
