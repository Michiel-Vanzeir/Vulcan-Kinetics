# Common misspellings, mapped to the canonical spelling used in vocab.yaml.
# Format: canonical form: [misspelling, misspelling, ...]
# Write misspellings in lowercase without accents; matching ignores case and accents,
# so missing accents ("preavis", "conge") never need an entry here.
# Each misspelling must be a single word. The canonical form may be several words.

opzegtermijn: [opzegtermein, opzegtermjin, opzegtermyn]
eindejaarspremie: [eindejaarpremie, eindjaarspremie, eindejaarspremi, eindjaarpremie]
