# whoknows topic vocabulary.
#
# This file IS the complete list of things the topic extractor can ever output:
#   - every key under `topics` (e.g. notice_period)
#   - country_<ISO2> for every country under `entities.country`
#   - PC_<3 digits> for joint committees matched by `entities.joint_committee.pattern`
#   - worker_<class> for every class under `entities.worker_class`
# Typed text never leaves the extractor; only these tokens do.
#
# Patterns are matched case-insensitively, without accents, on whole words, after
# stemming per language. Patterns of 1 to 3 letters (or, avg, uk, cdi, ...) only match
# when written in capitals. Dutch patterns of 9+ letters also match inside compounds.
#
# Removed because they fire on everyday sentences: notice ("I noticed"), employee,
# worker, manager, integration, depart/sortie/vertrek, index, termination, FR cadre
# ("dans le cadre de"). Some were replaced by longer, unambiguous phrases.

topics:
  notice_period:
    patterns:
      en: [notice period, resignation notice, termination notice]
      nl: [opzegtermijn, opzeg, opzegging, ontslagtermijn]
      fr: [preavis, préavis, delai de preavis, délai de préavis]
